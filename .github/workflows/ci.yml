name: NullOne CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile workspace/social/ops/scripts/*.py
          python -m py_compile workspace/social/tools/*.py

      - name: Block public Texbrif branding
        run: |
          matches="$(
            grep -RInE \
              --exclude-dir=.git \
              --exclude='*.pyc' \
              '#Texbrif|#texbrif' \
              workspace/social/ops/prompts \
              workspace/social/BRAND.md \
              workspace/social/CONTENT_RULES.md \
            || true
          )"

          violations="$(
            printf '%s\n' "$matches" |
            grep -vE '^workspace/social/ops/prompts/draft-factory\.md:[0-9]+:#(Texbrif|texbrif)$' \
            || true
          )"

          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            echo "Forbidden public legacy branding detected."
            exit 1
          fi

          echo "Public legacy-brand guard passed."

      - name: Block private/runtime paths
        run: |
          test ! -e workspace/social/ops/private
          test ! -e workspace/social/ops/manifests
          test ! -e workspace/social/ops/publish-callback-receipts
          test ! -e workspace/social/state
          test ! -e workspace/social/research
          test ! -e workspace/social/analytics

      - name: Install CI test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-runtime.txt \
            -r requirements-dev.txt

      - name: Verify installed Pillow matches reviewed manifest
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          pins = {}
          for line in Path("requirements-runtime.txt").read_text().splitlines():
              line = line.strip()
              if line and not line.startswith("#") and "==" in line:
                  name, _, version = line.partition("==")
                  pins[name.strip().lower()] = version.strip()
          expected = pins.get("pillow")
          assert expected, "Pillow pin missing from requirements-runtime.txt"
          import PIL
          assert PIL.__version__ == expected, (
              f"installed Pillow {PIL.__version__} != manifest pin {expected}")
          print(f"INSTALLED_PILLOW_PIN_VERIFIED={expected}")
          EOF

      - name: Run offline behavioral regression suite
        run: |
          python tests/run_offline.py
